<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChaloChale</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-md-12">
                <!-- Navbar content -->
                <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
                    <div class="container">
                        <a class="navbar-brand fw-bold">
                            <i class="fa-solid fa-plane-departure"></i>
                            ChaloChale
                        </a>
                       <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarTogglerDemo01" aria-controls="navbarTogglerDemo01" aria-expanded="false" aria-label="Toggle navigation">
                            <span class="navbar-toggler-icon"></span>
                        </button>
                        <div class="collapse navbar-collapse" id="menu">
                            <ul class="navbar-nav ms-auto">
                                <li class="nav-item"><a class="nav-link active" href="index.html">Home</a></li>
                                <li class="nav-item"><a class="nav-link" href="destination.html">Destination</a></li>
                                <li class="nav-item"><a class="nav-link" href="package.html">Package</a></li>
                                <li class="nav-item"><a class="nav-link" href="booking.html">Booking</a></li>
                                <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                                <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                                
                            </ul>
                            <a href="signup.html" class="btn btn-warning ms-lg-3" style="margin-right: 10px;">SignUp</a>
                            <a href="login.html" class="btn btn-warning ms-lg-3" style="margin-right: 10px;">Login</a>
                        </div>
                    </div>
                </nav>
            </div>
        </div>
        <section class="py-5 bg-light text-center">
            <div class="container">
                <h1 class="fw-bold">Travel Booking Form</h1>
                <p class="lead">Fill the form and submit your trvael request.</p>
            </div>
        </section>
        <section class="py-5">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-12 col-md-10 col-lg-8">
                        <div class="card shadow p-4 rounded-4">
                            <h3 class="fw-bold text-center mb-4">Book Your Trip</h3>
                            <form action="">
                                <div class="row">
                                    <div class="col-12 col-md-6 mb-3">
                                        <label class="form-label">Full Name</label>
                                        <input type="text" class="form-control" placeholder="Enter Your Name">
                                    </div>
                                    <div class="col-12 col-md-6 mb-3">
                                        <label class="form-label">Email</label>
                                        <input type="email" class="form-control" placeholder="Enter Email">
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-12 col-md-6 mb-3">
                                        <label class="form-label">Select Destination</label>
                                        <select name="" id="" class="form-select">
                                            <option>Goa</option>
                                            <option>Manali</option>
                                            <option>Kerala</option>
                                            <option>Varanasai</option>
                                            <option>Jaipur</option>

                                        </select>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">Select Date</label>
                                        <input type="date" class="form-control">
                                    </div> 
                                    <div class="mb-3">
                                        <label class="form-label">Number of People</label>
                                        <input type="number" class="form-control" placeholder="Enter no. of people">
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Message</label>
                                        <textarea name="" id="" class="form-control" rows="3" placeholder="Any Special Request?"></textarea>
                                    </div>
                                    <button type="submit" class="btn btn-success w-100">Submit Booking Request</button>

                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <footer class="bg-dark text-white text-center py-3 mt-5">
            <p class="mb-0">© 2026 ChaloChale Trvael App | Designed with Bootstrap</p>
        </footer>
    </div>
</body>
</html>
